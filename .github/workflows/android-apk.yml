name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [pokopia-ram-fix]
    paths:
      - 'android/**'
      - 'dm/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Pokopia shader script syntax
        run: python3 -m py_compile dm/gfx/tools/shader_split.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android NDK and CMake
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      # Keep the debug signing key across test builds so Android accepts APK updates.
      - name: Restore stable test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pokopia-test-signing-v1

      - name: Build on-device packer stage
        run: zsh android/ondevice/build.sh "$RUNNER_TEMP/nx-pack" all

      - name: Download Gradle with retries
        run: |
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 900 \
            --output "$RUNNER_TEMP/gradle-8.14.3-bin.zip" \
            https://downloads.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q "$RUNNER_TEMP/gradle-8.14.3-bin.zip" -d "$RUNNER_TEMP"

      - name: Build debug APK
        working-directory: android/app
        run: "$RUNNER_TEMP/gradle-8.14.3/bin/gradle" --no-daemon -PnxPackStage="$RUNNER_TEMP/nx-pack/stage" -PnxGames=040074A01BF12000,0400A3A01EE4C000 -PnxApp=pokopia -PnxLabel="Banana Native Pokopia" -PnxVersionCode=${{ github.run_number }} assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BananaNative-Pokopia-test
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
