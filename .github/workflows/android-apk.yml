name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [android]
    paths:
      - 'android/**'
      - 'dm/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android NDK and CMake
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Build on-device packer stage
        run: zsh android/ondevice/build.sh "$RUNNER_TEMP/nx-pack" all

      - name: Build debug APK
        working-directory: android/app
        run: ./gradlew --no-daemon -PnxPackStage="$RUNNER_TEMP/nx-pack/stage" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BananaNative-Android-debug
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
